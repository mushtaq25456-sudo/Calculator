<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        /* Base Page Styling */
        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        /* Calculator Glassmorphism Container */
        .calculator-card {
            background: rgba(30, 30, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 380px;
            padding: 25px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Title */
        .calculator-title {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
            padding-left: 5px;
            letter-spacing: 0.5px;
        }

        /* Upgraded Display Screen */
        .calculator-screen {
            background-color: #0d0d14;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 300;
            padding: 15px 20px;
            text-align: right;
            width: 100%;
            outline: none;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        /* Button Structural Changes */
        .calc-btn {
            width: 100%;
            aspect-ratio: 1; /* Makes buttons perfectly circular */
            border: none;
            border-radius: 50%;
            font-size: 1.35rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .calc-btn:active {
            transform: scale(0.92);
        }

        /* Color Themes for Buttons */
        .number-btn {
            background-color: #28283d;
            color: #ffffff;
        }
        .number-btn:hover {
            filter: brightness(1.2);
        }

        .operator-btn {
            background-color: #3b3b5c;
            color: #ff9f0a; /* Bright orange for main operators */
        }
        .operator-btn:hover {
            filter: brightness(1.2);
        }

        .action-btn {
            background-color: #212130;
            color: #0a84ff; /* Tech blue for math tools */
        }
        .action-btn:hover {
            filter: brightness(1.3);
        }

        .clear-btn {
            background-color: rgba(255, 69, 58, 0.15);
            color: #ff453a; /* Soft red for Clear */
        }
        .clear-btn:hover {
            background-color: rgba(255, 69, 58, 0.25);
        }

        .equals-btn {
            background: linear-gradient(135deg, #007aff 0%, #0056b3 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }
        .equals-btn:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1 class="calculator-title">Calculator</h1>
        
        <div class="row mb-4">
            <div class="col-12">
                <input type="text" class="calculator-screen" id="input" readonly placeholder="0" />
            </div>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-3"><button class="calc-btn action-btn" onclick="appendCube()">X³</button></div>
            <div class="col-3"><button class="calc-btn action-btn" onclick="appendSquare()">X²</button></div>
            <div class="col-3"><button class="calc-btn clear-btn" onclick="clearScreen()">C</button></div>
            <div class="col-3"><button class="calc-btn operator-btn" onclick="deleteLast()">⌫</button></div>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-3"><button class="calc-btn action-btn" onclick="appendValue('3.14159265')">π</button></div>
            <div class="col-3"><button class="calc-btn action-btn" onclick="calculateSquareRoot()">√</button></div>
            <div class="col-3"><button class="calc-btn action-btn" onclick="calculateCubeRoot()">∛</button></div>
            <div class="col-3"><button class="calc-btn operator-btn" onclick="appendValue('/')">/</button></div>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('7')">7</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('8')">8</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('9')">9</button></div>
            <div class="col-3"><button class="calc-btn operator-btn" onclick="appendValue('*')">*</button></div>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('4')">4</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('5')">5</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('6')">6</button></div>
            <div class="col-3"><button class="calc-btn operator-btn" onclick="appendValue('-')">-</button></div>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('1')">1</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('2')">2</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('3')">3</button></div>
            <div class="col-3"><button class="calc-btn operator-btn" onclick="appendValue('+')">+</button></div>
        </div>

        <div class="row g-2">
            <div class="col-3"><button class="calc-btn action-btn" onclick="appendValue('/100')">%</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('0')">0</button></div>
            <div class="col-3"><button class="calc-btn number-btn" onclick="appendValue('.')">.</button></div>
            <div class="col-3"><button class="calc-btn equals-btn" onclick="calculateResult()">=</button></div>
        </div>
    </div>

    <script src="app2.js"></script>
</body>
</html>
